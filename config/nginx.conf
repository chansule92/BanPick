# Gunicorn 서버 정의 (Django 백엔드)
upstream django {
    # 소켓 경로 (/tmp/gunicorn.sock)는 Dockerfile CMD와 일치
    server unix:/tmp/gunicorn.sock fail_timeout=0;
}

server {
    listen 8080;
    server_name localhost;
    
    # 🌟 STATIC_ROOT 경로 명시 (기본 root 참조 방지 목적)
    root /usr/src/app/static; 

    # 🚨🚨 NGINX의 index 파일 자동 찾기 기능 비활성화 🚨🚨
    # 이렇게 해야 NGINX가 / 요청 시 root/index.html(Django 템플릿 아님!)을 찾으려 하지 않습니다.
    index off; 

    # 🚨🚨 타임아웃 및 버퍼 설정을 서버 블록에 보강 🚨🚨
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 10M; # 최대 업로드 파일 크기
    
    # NGINX와 Gunicorn 간의 통신 안정성 향상
    client_body_in_file_only clean;
    client_body_buffer_size 32k;
    
    # 1. /static/ 요청 처리
    location /static/ {
        # collectstatic 결과물 경로 alias
        alias /usr/src/app/static/; 
        expires 30d;
        access_log off;
    }

    # 2. 나머지 모든 요청 (/)은 Django로 프록시 (가장 간단하고 확실한 방법으로 수정)
    location / {
        # 🚨🚨 파일 찾기 로직(try_files)을 제거하고 무조건 Django로 프록시하도록 수정 🚨🚨
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        
        # 프록시 타임아웃 설정을 명시적으로 다시 정의 (안정성 강화)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_pass http://django;
    }

    # 🚨 기존의 location @proxy_to_django 블록은 제거되었습니다. 🚨
}
