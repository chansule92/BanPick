upstream django {
    server unix:/tmp/gunicorn.sock fail_timeout=0;
}

server {
    listen 8080;
    server_name localhost;
    
    # 🌟 NGINX가 기본 페이지 대신 STATIC_ROOT를 참조하도록 명시
    root /usr/src/app/static; 

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 10M;

    # /static/ 요청은 NGINX가 직접 STATIC_ROOT에서 처리
    location /static/ {
        # 🚨 alias 경로를 STATIC_ROOT에 맞게 수정
        alias /usr/src/app/static/; 
    }

    # 나머지 모든 요청은 Django(Gunicorn)로 프록시
    location / {
        # root를 지정했기 때문에, 파일을 찾지 못하면 @proxy_to_django로 전달
        try_files $uri @proxy_to_django; 
    }

    # Gunicorn 프록시 블록
    location @proxy_to_django {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        
        proxy_pass http://django;
    }
}
