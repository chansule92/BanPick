# Gunicorn 서버 정의 (Django 백엔드)
upstream django {
    # 소켓 경로 (/tmp/gunicorn.sock)는 Dockerfile CMD와 일치
    server unix:/tmp/gunicorn.sock fail_timeout=0;
}

server {
    listen 0.0.0.0:8080;
    server_name localhost;
    
    # 🌟 STATIC_ROOT 경로 명시 (정적 파일만 서빙하도록 root 설정)
    root /usr/src/app/static; 

    # 🚨🚨 NGINX의 index 파일 자동 찾기 기능 비활성화 🚨🚨
    # NGINX가 root에서 index.html을 찾으려는 기본 동작을 차단하여 Django로 요청을 전달하게 합니다.
    index off; 

    # 🚨🚨 타임아웃 및 버퍼 설정을 서버 블록에 보강 🚨🚨
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 10M; # 최대 업로드 파일 크기
    
    # NGINX와 Gunicorn 간의 통신 안정성 향상
    client_body_in_file_only clean;
    client_body_buffer_size 32k;
    
    # 1. /static/ 요청 처리
    location /static/ {
        # collectstatic 결과물 경로 alias
        alias /usr/src/app/static/; 
        expires 30d;
        access_log off;
    }

    # 2. 나머지 모든 요청 (/)은 Django로 프록시
    location / {
        # 🚨🚨🚨 최종 수정: 존재하지 않는 파일명을 넣어 NGINX의 파일 찾기 로직을 무조건 건너뜁니다. 🚨🚨🚨
        try_files /_non_existent_file_to_force_proxy @proxy_to_django; 
    }

    # Gunicorn 프록시를 위한 전용 블록 (Named Location 복원)
    location @proxy_to_django {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        
        # 프록시 타임아웃 설정을 명시적으로 다시 정의 (안정성 강화)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_pass http://django;
    }
}
