upstream django {
    # Gunicorn이 바인딩할 유니콘 소켓 경로
    server unix:/tmp/gunicorn.sock fail_timeout=0;
}

server {
    listen 8080; # Render가 감지할 최종 포트
    server_name localhost;

    # 정적 파일 경로 (Dockerfile의 collectstatic 경로와 일치)
    location /static/ {
        alias /usr/src/app/static_root/; 
    }

    # 모든 요청을 유니콘 소켓을 통해 Gunicorn으로 전달
    location / {
        proxy_set_header Host $host;
        proxy_pass http://django;
    }
}
