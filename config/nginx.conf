# Gunicorn 서버 정의 (Django 백엔드)
upstream django {
    # Render 환경에서 Gunicorn 소켓 경로가 /tmp/gunicorn.sock 이라고 가정합니다.
    server unix:/tmp/gunicorn.sock fail_timeout=0;
}

server {
    # Render에서 사용하는 포트 (일반적으로 8080)
    listen 8080;
    server_name localhost;
    
    # 정적 파일에 대한 경로 설정 (선택 사항 - Django의 COLLECTSTATIC 결과물 경로)
    # NGINX가 정적 파일을 서빙할 때 사용할 기본 경로입니다.
    root /usr/src/app/static_root; 

    # 프록시 타임아웃 설정
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 10M;

    # 1. /static/ 요청 처리: 
    # 정적 파일(CSS, JS, 이미지 등)은 NGINX가 직접 서빙합니다.
    location /static/ {
        # 'alias'는 /static/ 요청을 이 경로(/usr/src/app/static_root/)로 연결합니다.
        alias /usr/src/app/static_root/;
        expires 30d; # 브라우저 캐시 설정 (성능 향상)
    }

    # 2. 나머지 모든 요청 (/) 처리:
    # 'Welcome to nginx!' 페이지가 나오는 것을 막고 Django로 전달하는 핵심 부분입니다.
    location / {
        # try_files $uri @proxy_to_django; 를 사용하면 root 경로에
        # Nginx 기본 index.html이 있을 경우 그 파일이 서빙됩니다.
        # 이를 방지하기 위해, 파일 찾기를 건너뛰고 바로 백엔드로 프록시하도록 설정합니다.
        
        # ⚠️ NGINX가 요청을 받으면 일단 404 오류로 간주하도록 속인 후,
        # 404 오류를 발생시키는 대신 @proxy_to_django 블록으로 요청을 전달합니다.
        error_page 404 = @proxy_to_django; 
    }

    # Gunicorn 프록시를 위한 전용 블록
    location @proxy_to_django {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        
        # 요청을 Django(Gunicorn)로 전달합니다.
        proxy_pass http://django;
    }
}
